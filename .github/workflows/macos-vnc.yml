name: macOS GUI VNC Test Session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session duration in minutes (max 180)'
        required: false
        default: '90'
        type: string
      dmg_url:
        description: 'macOS DMG URL to stage on Desktop'
        required: false
        default: 'https://releases.cerin.space/Cerin-1.3.2-arm64.dmg'
        type: string

jobs:
  macos-gui:
    name: Apple Silicon macOS Desktop (VNC)
    runs-on: macos-latest
    timeout-minutes: 190

    steps:
      - name: Prevent sleep and check hardware
        run: |
          echo "Host: $(uname -a)"
          sw_vers
          sudo caffeinate -d -i -m -s &

      - name: Enable macOS Screen Sharing (VNC)
        env:
          VNC_PASS: ${{ secrets.MACOS_VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASS" ]; then
            echo "ERROR: MACOS_VNC_PASSWORD secret is not set."
            exit 1
          fi
          sudo dscl . -passwd /Users/runner "$VNC_PASS"
          KICK="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          sudo "$KICK" -configure -allowAccessFor -allUsers -privs -all
          sudo "$KICK" -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASS"
          sudo "$KICK" -activate -restart -agent

          echo "Waiting for VNC port 5900..."
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 5900; then
              echo "VNC listening on 127.0.0.1:5900"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: VNC port 5900 did not come up."
          exit 1

      - name: Stage Cerin macOS DMG on Desktop
        env:
          DMG_URL: ${{ inputs.dmg_url }}
        run: |
          mkdir -p "$HOME/Desktop"
          DMG_NAME="$(basename "$DMG_URL")"
          curl -fL --retry 3 "$DMG_URL" -o "$HOME/Desktop/$DMG_NAME"
          ls -lh "$HOME/Desktop/$DMG_NAME"
          shasum -a 256 "$HOME/Desktop/$DMG_NAME"
          curl -fsSL https://releases.cerin.space/SHA256SUMS.txt || true

      - name: Install noVNC, websockify & cloudflared
        run: |
          mkdir -p /tmp/vnc
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/vnc/noVNC
          python3 -m venv /tmp/vnc/venv
          /tmp/vnc/venv/bin/pip install -q websockify

          curl -fL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" -o /tmp/vnc/cf.tgz
          tar -xzf /tmp/vnc/cf.tgz -C /tmp/vnc
          chmod +x /tmp/vnc/cloudflared

      - name: Start Browser VNC Tunnel & Keep Session Alive
        env:
          MINS: ${{ inputs.duration_minutes }}
        run: |
          nohup /tmp/vnc/venv/bin/websockify --web /tmp/vnc/noVNC 127.0.0.1:6080 127.0.0.1:5900 >/tmp/vnc/websockify.log 2>&1 &
          sleep 2

          nohup /tmp/vnc/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 >/tmp/vnc/cf.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/vnc/cf.log | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Failed to obtain Cloudflare quick tunnel URL."
            cat /tmp/vnc/cf.log || true
            exit 1
          fi

          echo "=========================================================="
          echo "MACOS_VNC_URL=${TUNNEL_URL}/vnc.html?resize=scale&autoconnect=1"
          echo "Use MACOS_VNC_PASSWORD from your private secret when prompted."
          echo "Touch ~/Desktop/STOP_VNC or cancel workflow to end early."
          echo "=========================================================="

          MAX_MINS="${MINS:-90}"
          if [ "$MAX_MINS" -gt 180 ] 2>/dev/null; then MAX_MINS=180; fi
          SECONDS_LEFT=$((MAX_MINS * 60))

          while [ "$SECONDS_LEFT" -gt 0 ]; do
            if [ -f "$HOME/Desktop/STOP_VNC" ]; then
              echo "STOP_VNC detected, shutting down session."
              break
            fi
            sleep 15
            SECONDS_LEFT=$((SECONDS_LEFT - 15))
          done
