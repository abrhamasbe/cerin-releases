name: macOS GUI VNC Test Session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session duration in minutes (max 60 for free Pinggy tunnel)'
        required: false
        default: '55'
        type: string
      dmg_url:
        description: 'macOS DMG URL to stage on Desktop'
        required: false
        default: 'https://releases.cerin.space/Cerin-1.3.2-arm64.dmg'
        type: string

jobs:
  macos-gui:
    name: Apple Silicon macOS Desktop (VNC)
    runs-on: macos-latest
    timeout-minutes: 70

    steps:
      - name: Prevent sleep, wake display, and stage Cerin DMG
        env:
          DMG_URL: ${{ inputs.dmg_url }}
        run: |
          sw_vers
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          sudo caffeinate -d -i -m -s -u </dev/null >/dev/null 2>&1 &
          caffeinate -u -t 5 || true

          mkdir -p "$HOME/Desktop"
          DMG_NAME="$(basename "$DMG_URL")"
          curl -fL --retry 3 "$DMG_URL" -o "$HOME/Desktop/$DMG_NAME"
          ls -lh "$HOME/Desktop/$DMG_NAME"
          open -a Finder "$HOME/Desktop" || true
          sleep 2
          screencapture -x /tmp/shot.png || true
          ls -lh /tmp/shot.png || true

      - name: Enable macOS Screen Sharing (VNC)
        env:
          VNC_PASS: ${{ secrets.MACOS_VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASS" ]; then
            echo "ERROR: MACOS_VNC_PASSWORD secret is not set."
            exit 1
          fi
          KICK="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          sudo "$KICK" -activate -configure -access -on -allowAccessFor -allUsers -privs -all -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASS" -restart -agent -console
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 5900; then
              echo "VNC listening on 127.0.0.1:5900"
              break
            fi
            sleep 1
          done
          nc -z 127.0.0.1 5900 || { echo "ERROR: VNC port 5900 did not come up."; exit 1; }

      - name: Install noVNC, websockify & verify VNC framebuffer pixels
        env:
          VNC_PASS: ${{ secrets.MACOS_VNC_PASSWORD }}
        run: |
          mkdir -p /tmp/vnc
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/vnc/noVNC
          python3 - <<'PY'
          import re
          rfb_path = "/tmp/vnc/noVNC/core/rfb.js"
          with open(rfb_path, "r") as f:
              txt = f.read()
          # Force VNCAuth (Security Type 2) instead of Apple ARD (Type 30)
          txt = re.sub(r'(\bsecurityTypeARD\b\s*,)', '// disabled: \\1', txt, count=1)
          with open(rfb_path, "w") as f:
              f.write(txt)

          err_path = "/tmp/vnc/noVNC/app/error-handler.js"
          with open(err_path, "r") as f:
              et = f.read()
          guard = "if (String(event?.filename || event?.reason?.stack || '').includes('extension://') || String(event?.message || event?.reason?.message || event?.reason || '').includes('MetaMask')) { return false; }\n"
          et = et.replace("function handleError(event, err) {", "function handleError(event, err) {\n    " + guard, 1)
          et = et.replace("if ((event.message ===", guard + "        if ((event.message ===", 1)
          with open(err_path, "w") as f:
              f.write(et)
          PY

          python3 -m venv /tmp/vnc/venv
          /tmp/vnc/venv/bin/pip install -q websockify pycryptodome

          python3 - <<'PY' || true
          import socket, struct, os
          from Crypto.Cipher import DES

          def bitrev(b):
              return int(f"{b:08b}"[::-1], 2)

          pw = os.environ["VNC_PASS"].encode("latin1")[:8].ljust(8, b"\x00")
          key = bytes(bitrev(b) for b in pw)

          s = socket.create_connection(("127.0.0.1", 5900), timeout=8)
          ver = s.recv(12)
          print("RFB ver:", ver)
          s.sendall(b"RFB 003.008\n")
          n = s.recv(1)[0]
          types = list(s.recv(n))
          print("Security types:", types)
          if 2 in types:
              s.sendall(b"\x02")
              chal = s.recv(16)
              resp = DES.new(key, DES.MODE_ECB).encrypt(chal)
              s.sendall(resp)
              res = struct.unpack(">I", s.recv(4))[0]
              print("VNCAuth result:", res)
              if res == 0:
                  s.sendall(b"\x01") # shared
                  init = s.recv(24)
                  w, h = struct.unpack(">HH", init[:4])
                  name_len = struct.unpack(">I", init[20:24])[0]
                  name = s.recv(name_len)
                  print("Desktop:", w, "x", h, name)
                  # SetEncodings (Raw = 0)
                  s.sendall(struct.pack(">BBHi", 2, 0, 1, 0))
                  # FramebufferUpdateRequest (full, non-incremental)
                  s.sendall(struct.pack(">BBHHHH", 3, 0, 0, 0, w, h))
                  hdr = s.recv(4)
                  print("Update hdr:", hdr)
                  chunk = s.recv(65536)
                  nonzero = sum(1 for b in chunk if b != 0)
                  print(f"Sampled {len(chunk)} framebuffer bytes, non-zero: {nonzero}")
          s.close()
          PY

      - name: Start Browser VNC & 60-min Pinggy HTTPS Tunnel
        run: |
          nohup /tmp/vnc/venv/bin/websockify --web /tmp/vnc/noVNC 127.0.0.1:6080 127.0.0.1:5900 </dev/null >/tmp/vnc/websockify.log 2>&1 &
          sleep 2

          TUNNEL_URL=""

          # 1. Pinggy.io (60-minute HTTPS/WSS tunnel, no rotation)
          nohup ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -p 443 -T -R0:127.0.0.1:6080 a.pinggy.io </dev/null >/tmp/vnc/pinggy.log 2>&1 &
          for i in $(seq 1 25); do
            TUNNEL_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.(pinggy-free\.link|pinggy\.net)' /tmp/vnc/pinggy.log | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "Got Pinggy tunnel: $TUNNEL_URL"
              break
            fi
            sleep 1
          done

          # 2. Fallback to Bore.pub (TCP/HTTP tunnel)
          if [ -z "$TUNNEL_URL" ]; then
            echo "Pinggy failed, trying bore-cli..."
            HOMEBREW_NO_AUTO_UPDATE=1 brew install bore-cli || true
            nohup bore local 6080 --to bore.pub </dev/null >/tmp/vnc/bore.log 2>&1 &
            for i in $(seq 1 20); do
              BORE_HOST=$(grep -Eo 'bore\.pub:[0-9]+' /tmp/vnc/bore.log | head -1 || true)
              if [ -n "$BORE_HOST" ]; then
                TUNNEL_URL="http://${BORE_HOST}"
                echo "Got Bore tunnel: $TUNNEL_URL"
                break
              fi
              sleep 1
            done
          fi

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: All tunnels failed."
            cat /tmp/vnc/pinggy.log || true
            cat /tmp/vnc/bore.log || true
            exit 1
          fi

          FULL_URL="${TUNNEL_URL}/vnc.html?resize=scale&autoconnect=1"
          echo "MACOS_VNC_URL=${FULL_URL}"
          echo "$FULL_URL" > /tmp/vnc/vnc-url.txt

      - name: Upload VNC URL & Desktop Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-vnc-url
          path: |
            /tmp/vnc/vnc-url.txt
            /tmp/shot.png
          retention-days: 1

      - name: Keep VNC Session Alive
        env:
          MINS: ${{ inputs.duration_minutes }}
        run: |
          nc -z 127.0.0.1 6080 || { echo "websockify not running"; exit 1; }
          MAX_MINS="${MINS:-55}"
          if [ "$MAX_MINS" -gt 60 ] 2>/dev/null; then MAX_MINS=60; fi
          SECONDS_LEFT=$((MAX_MINS * 60))
          while [ "$SECONDS_LEFT" -gt 0 ]; do
            if [ -f "$HOME/Desktop/STOP_VNC" ]; then break; fi
            sleep 15
            SECONDS_LEFT=$((SECONDS_LEFT - 15))
          done
