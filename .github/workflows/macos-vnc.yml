name: macOS GUI VNC Test Session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session duration in minutes (max 180)'
        required: false
        default: '90'
        type: string
      dmg_url:
        description: 'macOS DMG URL to stage on Desktop'
        required: false
        default: 'https://releases.cerin.space/Cerin-1.3.2-arm64.dmg'
        type: string

jobs:
  macos-gui:
    name: Apple Silicon macOS Desktop (VNC)
    runs-on: macos-latest
    timeout-minutes: 190

    steps:
      - name: Prevent sleep and check hardware
        run: |
          echo "Host: $(uname -a)"
          sw_vers
          sudo caffeinate -d -i -m -s >/dev/null 2>&1 &

      - name: Enable macOS Screen Sharing (VNC)
        env:
          VNC_PASS: ${{ secrets.MACOS_VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASS" ]; then
            echo "ERROR: MACOS_VNC_PASSWORD secret is not set."
            exit 1
          fi
          KICK="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          sudo "$KICK" -activate -configure -access -on -allowAccessFor -allUsers -privs -all -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASS" -restart -agent
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          echo "Waiting for VNC port 5900..."
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 5900; then
              echo "VNC listening on 127.0.0.1:5900"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: VNC port 5900 did not come up."
          exit 1

      - name: Stage Cerin macOS DMG on Desktop
        env:
          DMG_URL: ${{ inputs.dmg_url }}
        run: |
          mkdir -p "$HOME/Desktop"
          DMG_NAME="$(basename "$DMG_URL")"
          curl -fL --retry 3 "$DMG_URL" -o "$HOME/Desktop/$DMG_NAME"
          ls -lh "$HOME/Desktop/$DMG_NAME"
          shasum -a 256 "$HOME/Desktop/$DMG_NAME"

      - name: Install noVNC, websockify & cloudflared
        run: |
          mkdir -p /tmp/vnc
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/vnc/noVNC
          # Force VNCAuth (Security Type 2, -setvncpw) instead of Apple ARD (Type 30) and ignore browser extension errors (e.g. MetaMask)
          python3 - <<'PY'
          import re
          rfb_path = "/tmp/vnc/noVNC/core/rfb.js"
          with open(rfb_path, "r") as f:
              txt = f.read()
          txt = re.sub(r'(\bsecurityTypeARD\b\s*,)', '// disabled: \\1', txt, count=1)
          with open(rfb_path, "w") as f:
              f.write(txt)

          err_path = "/tmp/vnc/noVNC/app/error-handler.js"
          with open(err_path, "r") as f:
              et = f.read()
          guard = "if (String(event?.filename || event?.reason?.stack || '').includes('extension://') || String(event?.message || event?.reason?.message || event?.reason || '').includes('MetaMask')) { return false; }\n"
          et = et.replace("function handleError(event, err) {", "function handleError(event, err) {\n    " + guard, 1)
          et = et.replace("if ((event.message ===", guard + "        if ((event.message ===", 1)
          with open(err_path, "w") as f:
              f.write(et)
          PY
          python3 -m venv /tmp/vnc/venv
          /tmp/vnc/venv/bin/pip install -q websockify

          curl -fL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" -o /tmp/vnc/cf.tgz
          tar -xzf /tmp/vnc/cf.tgz -C /tmp/vnc
          chmod +x /tmp/vnc/cloudflared

      - name: Start Browser VNC Tunnel
        run: |
          nohup /tmp/vnc/venv/bin/websockify --web /tmp/vnc/noVNC 127.0.0.1:6080 127.0.0.1:5900 </dev/null >/tmp/vnc/websockify.log 2>&1 &
          sleep 2

          nohup /tmp/vnc/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 </dev/null >/tmp/vnc/cf.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/vnc/cf.log | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Failed to obtain Cloudflare quick tunnel URL."
            cat /tmp/vnc/cf.log || true
            exit 1
          fi

          FULL_URL="${TUNNEL_URL}/vnc.html?resize=scale&autoconnect=1"
          echo "MACOS_VNC_URL=${FULL_URL}"
          echo "$FULL_URL" > /tmp/vnc/vnc-url.txt
          {
            echo "### macOS VNC Session Ready"
            echo ""
            echo "- **URL:** $FULL_URL"
            echo "- **DMG staged at:** \`~/Desktop/Cerin-1.3.2-arm64.dmg\`"
            echo "- Use \`MACOS_VNC_PASSWORD\` when prompted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VNC URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-vnc-url
          path: /tmp/vnc/vnc-url.txt
          retention-days: 1

      - name: Keep VNC Session Alive
        env:
          MINS: ${{ inputs.duration_minutes }}
        run: |
          if ! nc -z 127.0.0.1 6080; then
            echo "ERROR: websockify stopped between steps!"
            cat /tmp/vnc/websockify.log || true
            exit 1
          fi
          echo "VNC and Cloudflare tunnel active. Session running for up to ${MINS:-90} minutes."
          MAX_MINS="${MINS:-90}"
          if [ "$MAX_MINS" -gt 180 ] 2>/dev/null; then MAX_MINS=180; fi
          SECONDS_LEFT=$((MAX_MINS * 60))

          while [ "$SECONDS_LEFT" -gt 0 ]; do
            if [ -f "$HOME/Desktop/STOP_VNC" ]; then
              echo "STOP_VNC detected, shutting down session."
              break
            fi
            sleep 15
            SECONDS_LEFT=$((SECONDS_LEFT - 15))
          done
